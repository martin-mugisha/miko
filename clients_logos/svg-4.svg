<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <!-- Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Dark Shadow/Base -->
    <ellipse cx="95" cy="100" rx="90" ry="95" fill="#11161B" />
    <!-- Iris (Cyan / Light Blue) -->
    <ellipse cx="100" cy="95" rx="80" ry="85" fill="#78B9DE" />
    <!-- Pupil (Dark Navy / Black) -->
    <circle cx="95" cy="95" r="45" fill="#0C1217" />
    <!-- Light Reflection (White Dot) -->
    <circle cx="120" cy="72" r="14" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(210, 130)">
    <text font-family="'Cinzel', 'Times New Roman', serif" font-weight="600" fill="#11161B">
      <tspan font-size="78">S</tspan><tspan font-size="58" dy="-4">ANTÉ</tspan>
    </text>
  </g>
</svg>
